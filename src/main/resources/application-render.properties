server.port=${PORT:10000}

# Render PostgreSQL for Neon database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET}
# Durée de validité du JWT : 8 h (une journée de travail)
jwt.expiration.milliseconds=28800000

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger désactivé en déploiement (SWAGGER_ENABLED=true pour l'activer ponctuellement)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed.methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
cors.allowed.headers=${CORS_ALLOWED_HEADERS:*}
cors.allow.credentials=${CORS_ALLOW_CREDENTIALS:true}

# Actuator endpoints for health checks
management.endpoints.web.exposure.include=health,info
# Détails de santé (base, disque...) réservés aux utilisateurs authentifiés
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoints.web.base-path=/actuator

spring.application.name=CLINIQUE-MANAGEMENT-BACKEND

default.admin.email=${DEFAULT_ADMIN_EMAIL}
default.admin.password=${DEFAULT_ADMIN_PASSWORD}



