spring.application.name=CLINIQUE-MANAGEMENT-BACKEND
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=9001

# Dev Database
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_name}
spring.datasource.username=${DB_username}
spring.datasource.password=${DB_password}

spring.jpa.hibernate.ddl-auto=validate

# Schéma géré par Flyway : migrations dans db/migration/{vendor} (postgresql ou sqlserver selon la base).
# Hibernate ne fait que valider le schéma au démarrage (ddl-auto=validate).
spring.flyway.locations=classpath:db/migration/{vendor}

# Pagination des listes (?page=0&size=20) : au plus 100 éléments par page, même si size est plus grand
spring.data.web.pageable.max-page-size=100

jwt.secret=${JWT_SECRET}
# Durée de validité du JWT : 8 h (une journée de travail)
jwt.expiration.milliseconds=28800000

# Mail config (dev)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging
logging.config=classpath:logback-spring.xml
logging.file.path=logs
logging.file.name=logs/clinique.log

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
cors.allowed.methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
cors.allowed.headers=${CORS_ALLOWED_HEADERS:*}
cors.allow.credentials=${CORS_ALLOW_CREDENTIALS:true}
