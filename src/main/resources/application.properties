spring.application.name=CLINIQUE-MANAGEMENT-BACKEND
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=9001

# Dev Database
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_name}
spring.datasource.username=${DB_username}
spring.datasource.password=${DB_password}

spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET}
jwt.expiration.milliseconds=86400000

# Mail config (dev)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging
logging.config=classpath:logback-spring.xml
logging.file.path=logs
logging.file.name=logs/clinique.log

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
cors.allowed.methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
cors.allowed.headers=${CORS_ALLOWED_HEADERS:*}
cors.allow.credentials=${CORS_ALLOW_CREDENTIALS:true}
