[phases.build]
cmds = ["./mvnw clean package -DskipTests"]

[phases.start]
cmd = "java $JAVA_OPTS -Dspring.profiles.active=railway -Dserver.port=${PORT:-8080} -jar target/CLINIQUE-MANAGEMENT-BACKEND-0.0.1-SNAPSHOT.jar"

[variables]
JAVA_OPTS = "-Xms256m -Xmx1024m -Djava.security.egd=file:/dev/./urandom"
SPRING_PROFILES_ACTIVE = "railway"